iv>\n<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n<\u002Fsc-for><\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:14px\">\n<div><\u002Fdiv>\n\n\n\n<\u002Fsection>\n\n\n\n<footer style=\"border:3px solid #1A1A1A;box-shadow:5px 5px 0 #1A1A1A;background:#212121;text-align:center\">\n<div style=\"background:#D92B2B;color:#FFFFFF;padding:10px;font-size:12px;font-weight:700;border-bottom:3px solid #1A1A1A\">ÉLECTIONS CAVL ·&nbsp;Chaque vote compte<\u002Fdiv>\n<div style=\"padding:24px 16px;display:flex;flex-direction:column;gap:16px;align-items:center\">\n<h2 style=\"margin:0;font-family:'Press Start 2P',monospace;font-size:22px;line-height:1.6;color:#FFFF55;text-shadow:3px 3px 0 #1A1A1A\">NATHANDEZ PAS,<br>VOTEZ POUR NOUS !<\u002Fh2>\n<button class=\"btn\" sc-camel-on-click=\"{{copyLink}}\" style=\"cursor:pointer;background:#C6C6C6;color:#1A1A1A;padding:14px 18px;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.6;min-height:48px\">{{copyLabel}}<\u002Fbutton><span style=\"font-size:12px;color:#C6C6C6\">Anaïs Schuller &amp; Nathan Bouchery<\u002Fspan><p style=\"margin:0;font-size:15px;color:#F3EAD8\"><br><\u002Fp>\n\n\n<\u002Fdiv><\u002Ffooter>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:5200}}\">\nclass Component extends DCLogic {\n  constructor(p){ super(p); this.state={nSkin:true,aSkin:true,open:0,cat:-1,count:0,err:'',sent:false,copied:false,now:Date.now()}; this.lycee=''; this.msg=''; }\n  componentDidMount(){ this.t=setInterval(()=>this.setState({now:Date.now()}),1000); }\n  componentWillUnmount(){ clearInterval(this.t); }\n  renderVals(){\n    const s=this.state, ms=Math.max(0,new Date('2026-12-01T17:00:00+01:00').getTime()-s.now), p=(n)=>String(n).padStart(2,'0');\n    const Q=[\n      ['HARCÈLEMENT & SANTÉ MENTALE','PRIORITÉ','Les dispositifs existent (pHARe), mais selon les lycées ils restent sur le papier. Tout le monde n’est donc pas protégé de la même façon.',['Déployer pHARe pour de bon dans chaque lycée.','Créer des temps d’écoute réguliers et bien identifiés.','Généraliser ce qui marche déjà dans certains établissements.']],\n      ['CASSER L’ISOLEMENT ENTRE LYCÉES','INTER-LYCÉES','Le CAVL ne doit pas être réservé aux lycées du centre de Strasbourg. Quand on est loin, on entend rarement parler de ce qui s’y passe.',['Organiser des événements inter-lycées : sport, culture, défis.','Aider les CVL à débloquer des subventions pour leurs projets.','Faire circuler les bonnes idées d’un lycée à l’autre.']],\n      ['QUOTIDIEN & ÉGALITÉ','AU QUOTIDIEN','Un distributeur vide, une info d’orientation floue : ce sont de petits blocages qui pèsent tous les jours.',['Vérifier que les distributeurs de protections périodiques sont vraiment remplis partout.','Rendre les infos d’orientation plus claires.','Mettre en place du mentorat entre lycéens et étudiants.']],\n      ['UN CAVL TRANSPARENT','TRANSPARENCE','Un conseil dont personne n’entend parler ne sert à personne. Les lycéens doivent savoir ce qui s’y décide.',['Publier un résumé court après chaque conseil au Rectorat.','Vous consulter avant de voter.','Dire clairement ce qui a été décidé, et par qui.']]];\n    const cats=['Harcèlement','Vie de lycée','Égalité','Orientation','Autre'];\n    return {\n      status: ms===0?'SCRUTIN CLÔTURÉ':'EN DIRECT',\n      cdD:p(Math.floor(ms/86400000)), cdH:p(Math.floor(ms%86400000/3600000)), cdM:p(Math.floor(ms%3600000/60000)), cdS:p(Math.floor(ms%60000/1000)),\n      nathanSkin:s.nSkin, nathanPhoto:!s.nSkin, anaisSkin:s.aSkin, anaisPhoto:!s.aSkin, always:true,\n      nathanLabel:s.nSkin?'VOIR LA PHOTO':'VOIR LE SKIN', anaisLabel:s.aSkin?'VOIR LA PHOTO':'VOIR LE SKIN',\n      toggleN:()=>this.setState({nSkin:!this.state.nSkin}), toggleA:()=>this.setState({aSkin:!this.state.aSkin}),\n      quests:Q.map((q,i)=>({n:i+1,title:q[0],tag:q[1],constat:q[2],points:q[3],open:s.open===i,chev:s.open===i?'▼':'▶',i1:i===0,i2:i===1,i3:i===2,i4:i===3,toggle:()=>this.setState({open:this.state.open===i?-1:i})})),\n      cats:cats.map((c,i)=>({label:c,on:s.cat===i,bg:s.cat===i?'#212121':'#FFFFFF',fg:s.cat===i?'#FFFF55':'#1A1A1A',pick:()=>this.setState({cat:this.state.cat===i?-1:i})})),\n      onLycee:(e)=>{this.lycee=e.target.value;}, onMsg:(e)=>{this.msg=e.target.value; this.setState({count:this.msg.length,err:''});},\n      count:s.count, err:s.err, sent:s.sent, notSent:!s.sent,\n      send:()=>{ if(!this.msg.trim()){this.setState({err:'Écris au moins un mot !'});return;} this.setState({sent:true}); },\n      copyLink:()=>{ try{navigator.clipboard.writeText(window.location.href);}catch(e){} this.setState({copied:true}); },\n      copyLabel:s.copied?'✔ LIEN COPIÉ !':'Partager le site'\n    };\n  }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
